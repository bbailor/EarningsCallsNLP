# conda env create -f environment.yml && conda activate ecnlp
name: ecnlp
channels: [conda-forge]
dependencies:
  - python=3.11
  - pip
  - requests>=2.31
  - pandas>=2.1
  - numpy>=1.26
  - pyyaml>=6.0
  - pyarrow>=14
  - python-dotenv>=1.0
  - pytest>=8
  - scikit-learn>=1.3
  - hdbscan>=0.8.33          # conda-forge build avoids compiling on Windows
  - umap-learn>=0.5
  - pip:
      - yfinance>=1.3
      - responses>=0.25
      - torch>=2.1           # CUDA build on Unity: see slurm/nlp.sbatch
      - transformers>=4.40
      - sentence-transformers>=3.0
      - bertopic>=0.16
      - -e .
