# conda env create -f environment.yml && conda activate ecnlp
name: ecnlp
channels: [conda-forge]
dependencies:
  - python=3.11
  - pip
  - requests>=2.31
  - pandas>=2.1
  - numpy>=1.26
  - pyyaml>=6.0
  - pyarrow>=14
  - python-dotenv>=1.0
  - pytest>=8
  - pip:
      - yfinance>=1.3
      - responses>=0.25
      - -e .
