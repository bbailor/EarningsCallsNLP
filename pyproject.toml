[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecnlp"
version = "0.1.0"
description = "Earnings Call Technology Analyzer - data ingestion, preparation and NLP"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pandas>=2.1", "numpy>=1.26", "pyyaml>=6.0",
                "yfinance>=1.3", "pyarrow>=14", "python-dotenv>=1.0"]

[project.optional-dependencies]
# FinBERT + BERTopic stages:  pip install -e ".[nlp]"
nlp = ["torch>=2.1", "transformers>=4.40", "sentence-transformers>=3.0", "bertopic>=0.16",
       "umap-learn>=0.5", "hdbscan>=0.8.33", "scikit-learn>=1.3"]

[project.scripts]
ecnlp = "ecnlp.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
