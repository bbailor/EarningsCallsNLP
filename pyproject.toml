[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecnlp"
version = "0.1.0"
description = "Earnings Call Technology Analyzer - data ingestion and preparation"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pandas>=2.1", "numpy>=1.26", "pyyaml>=6.0",
                "yfinance>=1.3", "pyarrow>=14", "python-dotenv>=1.0"]

[project.scripts]
ecnlp = "ecnlp.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
